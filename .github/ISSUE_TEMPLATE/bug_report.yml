name: Bug Report
description: Report a bug with the DNS updater
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Fill out all required fields.** Incomplete reports will be closed.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - DNS update failure
        - IP detection issue
        - Notification issue (Apprise)
        - Docker / deployment
        - Other
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Docker Compose
        - Docker run
        - Native Python
    validations:
      required: true
  - type: dropdown
    id: reverse-proxy
    attributes:
      label: Behind a reverse proxy?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: input
    id: docker-version
    attributes:
      label: Docker version
      description: "Output of: docker --version"
      placeholder: "Docker version 27.5.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Container logs
      description: "Output of: docker logs autodns --tail 50. Redact any tokens/IPs."
      render: text
    validations:
      required: true
